# Copy to <product repo>/.github/workflows/ai-review-request.yml (AIW-464).
#
# Holds only a dispatch-only token (Actions read/write on AI-mgt-workflows, no Contents access: someone
# who extracts it can start reviews, not write to that repo). The approving token (AI_REVIEWER_TOKEN) must NEVER be added to a
# product repo, and this workflow must never use pull_request_target. Same-repo PRs only: fork PRs
# get no secrets and are skipped.

name: ai-review-request

on:
  pull_request:
    types: [review_requested]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event.requested_reviewer.login == 'drcarmen-ai-reviewer' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask AI-mgt-workflows to review
        env:
          DISPATCH_TOKEN: ${{ secrets.AI_REVIEW_DISPATCH_TOKEN }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/drcarmen/AI-mgt-workflows/actions/workflows/pr-review.yml/dispatches \
            -d "{\"ref\":\"master\",\"inputs\":{\"repo\":\"$REVIEW_REPO\",\"pr\":\"$REVIEW_PR\"}}"
